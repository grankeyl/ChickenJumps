server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Статика для фронта (SPA)
    location / {
        try_files $uri /index.html;
    }

    # Кэшируем статику
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|otf|svg|mp4|webm)$ {
        expires max;
        log_not_found off;
    }
} 